<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35101f"><title>افشین ❤️ عاطفه</title>
<style>
:root{--bg:#2b0918;--bg2:#55162f;--card:#fffaf7;--txt:#3b1524;--mut:#805b68;--a:#cf5d7e;--line:#ead7de}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#8f315044,transparent 30%),linear-gradient(150deg,var(--bg),var(--bg2));color:white}
body:before,body:after{content:"♥";position:fixed;font-size:9rem;color:#ffffff0d;pointer-events:none}body:before{top:-35px;left:-25px}body:after{bottom:-45px;right:-20px}
.app{width:min(100%,680px);margin:auto;padding:18px 14px 35px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900}.music{width:42px;height:42px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff12;color:#fff}
.track{height:6px;background:#ffffff20;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ef9caf,#ffe9dc);transition:.25s}.prog{font-size:.8rem;color:#ffffffbb;margin:7px 2px 15px}
.card{background:var(--card);color:var(--txt);border-radius:27px;min-height:480px;padding:27px 19px;box-shadow:0 24px 70px #11030a66;animation:in .3s ease}.ey{color:var(--a);font-weight:900;font-size:.86rem}h1,h2{line-height:1.55;margin:7px 0}h1{font-size:clamp(1.55rem,6vw,2.35rem)}h2{font-size:clamp(1.35rem,5vw,1.9rem)}.lead{color:var(--mut);line-height:1.9}.heart{text-align:center;font-size:5rem;margin:20px 0}
.choices{display:grid;gap:10px;margin-top:18px}.ch,.btn{font:inherit;border:0;cursor:pointer}.ch{background:#fff;border:1px solid var(--line);padding:14px;border-radius:17px;text-align:right;color:var(--txt);display:flex;gap:10px;align-items:center;min-height:58px}.ch:hover{border-color:#cf5d7e88;transform:translateY(-1px)}.ch b{display:block}.ch small{display:block;color:var(--mut);margin-top:3px}
.btn{min-height:50px;border-radius:15px;padding:0 17px;font-weight:900}.p{background:linear-gradient(135deg,var(--a),#ae365d);color:#fff}.s{background:#fff0f4;color:#8e3150}.g{background:#ffffff12;color:#fff;border:1px solid #ffffff22}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font:inherit;background:white}.custom{display:grid;gap:9px;margin-top:13px}
.nav{margin-top:12px}.nav .btn{min-height:44px}.ticket{margin-top:15px;border:1px dashed #b96d85;border-radius:22px;padding:18px;background:linear-gradient(#fff,#fff6f1)}.tt{text-align:center;font-weight:900;font-size:1.35rem}.sub{text-align:center;color:var(--mut);margin:5px 0 14px}.ti{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}.ti span{color:var(--mut)}.code{text-align:center;color:#9d3c5d;font-weight:900;letter-spacing:1px;margin-top:15px}.photo{aspect-ratio:16/9;border-radius:20px;background:linear-gradient(135deg,#f5dbe4,#ffefe5);display:grid;place-items:center;color:#90536a;margin-top:14px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;direction:ltr;margin-top:12px}.cb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.cb b{display:block;color:#943250;font-size:1.25rem}.cb span{color:var(--mut);font-size:.7rem}.msg{background:#fff0f4;color:#6c2941;border-radius:17px;padding:14px;line-height:1.95;margin-top:15px}.center{text-align:center;padding-top:35px}.big{font-size:4.5rem}.note{font-size:.8rem;color:var(--mut);line-height:1.8}
@media(min-width:600px){.card{padding:36px}.choices.two{grid-template-columns:1fr 1fr}}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>
<main class="app"><div class="top"><div class="brand">افشین ❤️ عاطفه</div><button class="music" id="music">♫</button></div>
<div class="track"><div class="bar" id="bar"></div></div><div class="prog" id="prog">شروع</div>
<section class="card" id="c"></section><div class="nav"><button class="btn g" id="back">مرحله قبل</button></div></main>
<script>
var K="aa-date-v1",st=JSON.parse(localStorage.getItem(K)||"null")||{step:0,ok:null,date:"",time:"",activity:"",bring:"",after:""};
var c=document.getElementById("c"),bar=document.getElementById("bar"),prog=document.getElementById("prog"),back=document.getElementById("back");
function save(){localStorage.setItem(K,JSON.stringify(st))}function go(n){st.step=n;save();render()}function btn(e,t,s,f){var b=document.createElement("button");b.className="ch";b.innerHTML="<span style='font-size:1.35rem'>"+e+"</span><span><b>"+t+"</b>"+(s?"<small>"+s+"</small>":"")+"</span>";b.onclick=f;return b}
function head(n,t,l){c.innerHTML="<div class='ey'>مرحله "+n+"</div><h2>"+t+"</h2><p class='lead'>"+l+"</p>"}function addChoices(arr,key,next){var w=document.createElement("div");w.className="choices two";arr.forEach(function(x){w.appendChild(btn(x[0],x[1],x[2]||"",function(){st[key]=x[1];go(next)}))});c.appendChild(w)}
function intro(){c.innerHTML="<div class='ey'>فقط برای عاطفه ❤️</div><h1>عاطفه، یه برنامه کوچولو برای دوتامون دارم... میای؟ ❤️</h1><p class='lead'>افشین یه دعوت کوچیک برات ساخته؛ بقیه‌ش رو خودت می‌چینی.</p><div class='heart'>💌</div><div class='row'><button class='btn p' id='yes'>آره 😍</button><button class='btn s' id='no'>نه</button></div>";yes.onclick=function(){st.ok=true;save();c.innerHTML="<div class='center'><div class='big'>🥰❤️</div><h2>پس قراره بریم!</h2><p class='lead'>حالا بیا با هم جزئیاتش رو بچینیم.</p></div>";setTimeout(function(){go(1)},700)};no.onclick=function(){st.ok=false;save();c.innerHTML="<div class='center'><div class='big'>🙂❤️</div><h2>باشه خانوم</h2><p class='lead'>هیچ اجباری نیست. پیشنهاد افشین سر جاشه؛ هر وقت دلت خواست دوباره برگرد.</p><button class='btn s' id='again'>برگردیم</button></div>";again.onclick=function(){st.ok=null;go(0)}}}
function dateStep(){head(1,"چه روزی بریم؟","یه تاریخی رو انتخاب کن که حال دوتامون خوب باشه.");c.innerHTML+="<div class='custom'><input class='input' id='date' type='date' value='"+st.date+"'><button class='btn p' id='dateok'>این روز خوبه ❤️</button></div>";dateok.onclick=function(){if(!date.value)return;st.date=date.value;go(2)}}
function timeStep(){head(2,"چه ساعتی بیشتر دوست داری؟","قرارمون رو به وقت خودمون تنظیم کنیم.");addChoices([["🌤️","صبح","۱۰:۳۰"],["☀️","ظهر","۱۳:۳۰"],["🌇","عصر","۱۷:۳۰"],["🌙","شب","۲۰:۳۰"]],"time",3);c.innerHTML+="<div class='custom'><input class='input' id='tm' type='time'><button class='btn s' id='tmok'>ساعت دلخواه</button></div>";tmok.onclick=function(){if(!tm.value)return;st.time=tm.value;go(3)}}
function generic(n,title,lead,arr,key,next,ph){head(n,title,lead);addChoices(arr,key,next);var d=document.createElement("div");d.className="custom";d.innerHTML="<input class='input' id='ct' maxlength='60' placeholder='"+ph+"'><button class='btn s' id='ctok'>پیشنهاد خودم</button>";c.appendChild(d);ctok.onclick=function(){if(!ct.value.trim())return;st[key]=ct.value.trim();go(next)}}
function act(){generic(3,"چه جور قراری بریم؟","یکی رو انتخاب کن یا پیشنهاد خودت رو بنویس.",[["☕","کافه","یه جای دنج"],["🍽️","شام دونفره","آروم و خوشمزه"],["🎬","فیلم","با انتخاب تو"],["🚶","قدم زدن","بدون عجله"],["🚗","دور دور","با موزیک"],["🌌","شب‌گردی","یه شب متفاوت"]],"activity",4,"مثلاً بستنی و قدم زدن")}
function bring(){generic(4,"افشین چی با خودش بیاره؟ 😄","این یکی با تو؛ من انجامش می‌دم.",[["🌹","گل","همیشه قشنگ"],["🍫","یه چیز شیرین","برای بعد"],["🎵","پلی‌لیست مخصوص","آهنگ‌های خودمون"],["🎁","سورپرایز","نپرس چی 😄"],["❤️","فقط خودش","همین کافیه"]],"bring",5,"مثلاً یه یادداشت دست‌نویس")}
function after(){generic(5,"بعدش چی؟","قرارمون می‌تونه ادامه قشنگی هم داشته باشه.",[["🍰","دسر","یه پایان شیرین"],["🌌","تماشای آسمون","اگر هوا خوب بود"],["🚗","یه دور طولانی","بدون مقصد"],["☕","یه جای دیگه","ادامه بدیم"],["🚶","قدم زدن","آروم و طولانی"],["😄","هرچی پیش اومد","برنامه آزاد"]],"after",6,"مثلاً بریم یه جای خاطره‌انگیز")}
function faDate(v){if(!v)return"";try{return new Intl.DateTimeFormat("fa-IR",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date(v+"T12:00:00"))}catch(e){return v}}
function start(){if(!st.date||!st.time)return null;return new Date(st.date+"T"+st.time+":00")}function countdown(){var t=start(),d=t?Math.max(0,t-Date.now()):0;return [Math.floor(d/86400000),Math.floor(d%86400000/3600000),Math.floor(d%3600000/60000),Math.floor(d%60000/1000)]}
function ticket(){var x=countdown();c.innerHTML="<div class='ey'>قرارمون قطعی شد ❤️</div><h2>بلیت قرار افشین و عاطفه</h2><div class='photo'>📷 عکس دونفره‌مون اینجا میاد</div><div class='ticket' id='pass'><div class='tt'>DATE PASS · قرار دونفره</div><div class='sub'>افشین ❤️ عاطفه</div><div class='ti'><span>روز</span><b>"+faDate(st.date)+"</b></div><div class='ti'><span>ساعت</span><b>"+st.time+"</b></div><div class='ti'><span>قرار</span><b>"+st.activity+"</b></div><div class='ti'><span>افشین میاره</span><b>"+st.bring+"</b></div><div class='ti'><span>بعدش</span><b>"+st.after+"</b></div><div class='code'>ADMIT TWO · A♥A</div></div><p class='lead' style='text-align:center'>تا قرارمون مونده</p><div class='cd' id='cd'></div><div class='msg'>عاطفه جان، قرار نیست این فقط یک برنامه باشه؛ می‌خوام هر بار که این صفحه رو می‌بینی، یادت بیاد چقدر کنار تو بودن برای من قشنگه. ❤️ — افشین</div><div class='row'><button class='btn p' id='cal'>اضافه به تقویم</button><button class='btn s' id='share'>اشتراک‌گذاری ❤️</button><button class='btn s' id='pic'>ذخیره بلیت</button><button class='btn s' id='reset'>از اول</button></div><p class='note'>نسخه فعلی بدون عکس و آهنگ شخصی است؛ بعداً می‌تونیم هر دو را اضافه کنیم.</p>";tick();cal.onclick=ics;share.onclick=shareIt;pic.onclick=picIt;reset.onclick=function(){localStorage.removeItem(K);location.reload()}}
function tick(){var e=document.getElementById("cd");if(!e)return;var x=countdown(),l=["روز","ساعت","دقیقه","ثانیه"];e.innerHTML=x.map(function(v,i){return"<div class='cb'><b>"+String(v).padStart(2,"0")+"</b><span>"+l[i]+"</span></div>"}).join("");setTimeout(tick,1000)}
function ics(){var s=start();if(!s)return;var e=new Date(s.getTime()+7200000),f=function(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z")};var data="BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:"+f(s)+"\nDTEND:"+f(e)+"\nSUMMARY:قرار افشین و عاطفه ❤️\nDESCRIPTION:"+st.activity+" | "+st.bring+" | "+st.after+"\nEND:VEVENT\nEND:VCALENDAR";var b=new Blob([data],{type:"text/calendar"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="afshin-atefeh-date.ics";a.click()}
async function shareIt(){var t="قرار افشین و عاطفه ❤️\n"+faDate(st.date)+" ساعت "+st.time+"\n"+st.activity+" · "+st.bring+" · "+st.after;try{if(navigator.share)await navigator.share({title:"قرار افشین و عاطفه",text:t,url:location.href});else{await navigator.clipboard.writeText(t+"\n"+location.href);alert("کپی شد ❤️")}}catch(e){}}
function picIt(){var cv=document.createElement("canvas");cv.width=1080;cv.height=1200;var q=cv.getContext("2d"),g=q.createLinearGradient(0,0,1080,1200);g.addColorStop(0,"#35101f");g.addColorStop(1,"#792544");q.fillStyle=g;q.fillRect(0,0,1080,1200);q.fillStyle="#fff8f2";q.fillRect(80,80,920,1040);q.textAlign="center";q.direction="rtl";q.fillStyle="#651f3b";q.font="bold 56px Tahoma";q.fillText("قرار افشین و عاطفه ❤️",540,180);q.font="34px Tahoma";q.fillText(faDate(st.date)+" — "+st.time,540,260);q.font="bold 38px Tahoma";q.fillText(st.activity,540,430);q.fillText(st.bring,540,560);q.fillText(st.after,540,690);q.fillStyle="#b83f67";q.fillText("A♥A · ADMIT TWO",540,980);var a=document.createElement("a");a.download="date-pass.png";a.href=cv.toDataURL("image/png");a.click()}
function render(){var p=Math.min(st.step,6);bar.style.width=(p/6*100)+"%";prog.textContent=st.step===0?"شروع":"مرحله "+st.step+" از 6";back.style.visibility=st.step>0&&st.step<6?"visible":"hidden";[intro,dateStep,timeStep,act,bring,after,ticket][st.step]()}
back.onclick=function(){if(st.step>0)go(st.step-1)};document.getElementById("music").onclick=function(){alert("آهنگ مشترکتون رو که بفرستی، همین دکمه پخشش می‌کنه 🎵")};render();
</script></body></html>
